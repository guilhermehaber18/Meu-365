<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu 365</title>
       <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
     <meta name="theme-color" content="#0f1419">
     <meta name="description" content="Jogos, onde passa e estatísticas dos meus times favoritos">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>⚽ Meu 365</h1>
           <div class="topo-info">
         <span id="atualizado"></span>
         <button id="botao-atualizar" onclick="atualizar()">🔄</button>
       </div>
  </header>

  <nav class="abas">
    <button class="aba ativa" onclick="abrirAba('hoje', this)">Hoje</button>
    <button class="aba" onclick="abrirAba('semana', this)">Semana</button>
    <button class="aba" onclick="abrirAba('mes', this)">Mês</button>
    <button class="aba" onclick="abrirAba('favoritos', this)">⭐ Favoritos</button>
    <button class="aba" onclick="abrirAba('estatisticas', this)">📊 Estatísticas</button>
  </nav>

  <main>
    <section id="hoje" class="conteudo ativo">
      <h2>Jogos de hoje</h2>
     <div id="lista-hoje"></div>
    </section>

       <section id="semana" class="conteudo">
      <h2>Próximos 7 dias</h2>
      <div id="lista-semana"></div>
    </section>

    <section id="mes" class="conteudo">
      <h2>Próximos 30 dias</h2>
      <div id="lista-mes"></div>
    </section>

    <section id="favoritos" class="conteudo">
      <h2>Meus favoritos</h2>
      <div id="lista-favoritos"></div>
    </section>

    <section id="estatisticas" class="conteudo">
      <h2>Estatísticas</h2>
            <div class="filtros">
        <button class="filtro ativa" onclick="carregarClassificacao('BSA', this)">Brasileirão</button>
        <button class="filtro" onclick="carregarClassificacao('PL', this)">Premier League</button>
        <button class="filtro" onclick="carregarClassificacao('CL', this)">Champions</button>
      </div>
      <div id="lista-estatisticas"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
